<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Calculator & Unit Converter</title>

  <!-- PWA & Mobile Standalone Settings -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #0b1120;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 460px;
      background-color: #1e293b;
      display: flex;
      flex-direction: column;
      padding: 0.75rem 0.75rem calc(0.5rem + env(safe-area-inset-bottom, 0px)) 0.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
    }

    @media (min-width: 600px) {
      .app-container {
        height: 94vh;
        max-height: 870px;
        border-radius: 2rem;
        padding: 1.25rem;
      }
    }

    /* Top Tabs */
    .nav-tabs {
      display: flex;
      background-color: #0f172a;
      border-radius: 0.85rem;
      padding: 0.3rem;
      margin-bottom: 0.75rem;
      gap: 0.35rem;
    }

    .nav-tab {
      flex: 1;
      padding: 0.65rem 0.2rem;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 0.6rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .nav-tab.active {
      background-color: #334155;
      color: #f8fafc;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* Windows */
    .view-panel {
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    /* Display Area */
    .display-screen {
      flex: 0 0 22%;
      min-height: 110px;
      background-color: #0f172a;
      border-radius: 1.15rem;
      padding: 0.85rem 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      margin-bottom: 0.75rem;
      overflow: hidden;
      word-break: break-all;
      position: relative;
    }

    .mode-indicator {
      position: absolute;
      top: 0.65rem;
      left: 0.85rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: #38bdf8;
      background: #1e293b;
      padding: 0.2rem 0.5rem;
      border-radius: 0.4rem;
      cursor: pointer;
    }

    .sub-display {
      color: #94a3b8;
      font-size: 1.05rem;
      min-height: 1.4rem;
      margin-bottom: 0.25rem;
    }

    .main-display {
      color: #f8fafc;
      font-size: 2.9rem;
      font-weight: 700;
      line-height: 1.1;
      text-align: right;
    }

    /* Keypads */
    .keypad-basic {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 0.65rem;
    }

    .keypad-scientific {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(7, 1fr);
      gap: 0.45rem;
    }

    /* Buttons */
    button {
      width: 100%;
      height: 100%;
      border-radius: 0.85rem;
      border: none;
      font-size: 1.35rem;
      font-weight: 600;
      cursor: pointer;
      color: #f8fafc;
      background-color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: filter 0.15s ease, transform 0.06s ease;
      touch-action: manipulation;
    }

    button:active {
      filter: brightness(1.25);
      transform: scale(0.96);
    }

    button.btn-fn {
      background-color: #475569;
      color: #f8fafc;
      font-size: 1.15rem;
    }

    button.btn-sci {
      background-color: #1e293b;
      color: #38bdf8;
      font-size: 1rem;
      border: 1px solid #334155;
    }

    button.btn-op {
      background-color: #f97316;
      color: #ffffff;
      font-size: 1.7rem;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35);
    }

    button.btn-op:active {
      background-color: #ea580c;
    }

    button.btn-equal {
      grid-column: span 2;
      background-color: #ea580c;
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 800;
      box-shadow: 0 5px 16px rgba(234, 88, 12, 0.45);
    }

    button.btn-equal:active {
      background-color: #c2410c;
    }

    /* Unit Converter */
    .converter-card {
      flex: 1;
      background-color: #0f172a;
      border-radius: 1.15rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }

    .converter-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .converter-label {
      color: #94a3b8;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input[type="number"] {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      font-size: 1.15rem;
      font-weight: 500;
      outline: none;
      user-select: text;
    }

    select:focus, input[type="number"]:focus {
      border-color: #38bdf8;
    }

    .swap-row {
      display: flex;
      justify-content: center;
      margin: -0.25rem 0;
    }

    .swap-circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #334155;
      color: #38bdf8;
      font-size: 1.4rem;
    }

    .result-display-box {
      background: #1e293b;
      border-radius: 0.85rem;
      padding: 1.1rem;
      border-left: 4px solid #f97316;
      margin-top: 0.25rem;
    }

    .result-number {
      font-size: 1.85rem;
      font-weight: 700;
      color: #f8fafc;
      word-break: break-all;
    }

    .result-unit-name {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 0.35rem;
    }

    /* Footer */
    .developer-tag {
      text-align: center;
      color: #64748b;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.4px;
      padding-top: 0.55rem;
      user-select: text;
    }

    .developer-tag a {
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
    }

    .developer-tag a:hover {
      color: #f97316;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Tabs -->
    <div class="nav-tabs">
      <button id="tab-basic" class="nav-tab active" onclick="switchWindow('basic')">Basic</button>
      <button id="tab-sci" class="nav-tab" onclick="switchWindow('sci')">Scientific</button>
      <button id="tab-conv" class="nav-tab" onclick="switchWindow('conv')">Unit Converter</button>
    </div>

    <!-- WINDOW 1: BASIC CALCULATOR -->
    <div id="view-basic" class="view-panel" style="display: flex;">
      <div class="display-screen">
        <div id="basic-prev" class="sub-display"></div>
        <div id="basic-cur" class="main-display">0</div>
      </div>
      <div class="keypad-basic">
        <button class="btn-fn" onclick="basicClear()">AC</button>
        <button class="btn-fn" onclick="basicDelete()">DEL</button>
        <button class="btn-fn" onclick="basicOp('%')">%</button>
        <button class="btn-op" onclick="basicOp('÷')">÷</button>

        <button onclick="basicNum('7')">7</button>
        <button onclick="basicNum('8')">8</button>
        <button onclick="basicNum('9')">9</button>
        <button class="btn-op" onclick="basicOp('×')">×</button>

        <button onclick="basicNum('4')">4</button>
        <button onclick="basicNum('5')">5</button>
        <button onclick="basicNum('6')">6</button>
        <button class="btn-op" onclick="basicOp('-')">-</button>

        <button onclick="basicNum('1')">1</button>
        <button onclick="basicNum('2')">2</button>
        <button onclick="basicNum('3')">3</button>
        <button class="btn-op" onclick="basicOp('+')">+</button>

        <button onclick="basicNum('0')">0</button>
        <button onclick="basicDecimal()">.</button>
        <button class="btn-equal" onclick="basicCalculate()">=</button>
      </div>
    </div>

    <!-- WINDOW 2: SCIENTIFIC CALCULATOR -->
    <div id="view-sci" class="view-panel" style="display: none;">
      <div class="display-screen">
        <span id="sci-angle-badge" class="mode-indicator" onclick="toggleSciAngle()">DEG</span>
        <div id="sci-prev" class="sub-display"></div>
        <div id="sci-cur" class="main-display">0</div>
      </div>
      <div class="keypad-scientific">
        <!-- Row 1 -->
        <button class="btn-sci" onclick="toggleSciAngle()">DEG/RAD</button>
        <button class="btn-sci" onclick="sciInsert('sin(')">sin</button>
        <button class="btn-sci" onclick="sciInsert('cos(')">cos</button>
        <button class="btn-sci" onclick="sciInsert('tan(')">tan</button>
        <button class="btn-fn" onclick="sciClear()">AC</button>

        <!-- Row 2 -->
        <button class="btn-sci" onclick="sciInsert('π')">π</button>
        <button class="btn-sci" onclick="sciInsert('e')">e</button>
        <button class="btn-sci" onclick="sciInsert('log(')">log</button>
        <button class="btn-sci" onclick="sciInsert('ln(')">ln</button>
        <button class="btn-fn" onclick="sciDelete()">DEL</button>

        <!-- Row 3 -->
        <button class="btn-sci" onclick="sciInsert('√(')">√</button>
        <button class="btn-sci" onclick="sciInsert('^')">xʸ</button>
        <button class="btn-sci" onclick="sciInsert('(')">(</button>
        <button class="btn-sci" onclick="sciInsert(')')">)</button>
        <button class="btn-op" onclick="sciInsert('÷')">÷</button>

        <!-- Row 4 -->
        <button class="btn-sci" onclick="sciInsert('!')">n!</button>
        <button onclick="sciInsert('7')">7</button>
        <button onclick="sciInsert('8')">8</button>
        <button onclick="sciInsert('9')">9</button>
        <button class="btn-op" onclick="sciInsert('×')">×</button>

        <!-- Row 5 -->
        <button class="btn-sci" onclick="sciInsert('%')">%</button>
        <button onclick="sciInsert('4')">4</button>
        <button onclick="sciInsert('5')">5</button>
        <button onclick="sciInsert('6')">6</button>
        <button class="btn-op" onclick="sciInsert('-')">-</button>

        <!-- Row 6 -->
        <button class="btn-sci" onclick="sciInsert('±')">±</button>
        <button onclick="sciInsert('1')">1</button>
        <button onclick="sciInsert('2')">2</button>
        <button onclick="sciInsert('3')">3</button>
        <button class="btn-op" onclick="sciInsert('+')">+</button>

        <!-- Row 7 -->
        <button onclick="sciInsert('0')">0</button>
        <button onclick="sciInsert('00')">00</button>
        <button onclick="sciInsert('.')">.</button>
        <button class="btn-equal" onclick="sciCalculate()">=</button>
      </div>
    </div>

    <!-- WINDOW 3: UNIT CONVERTER -->
    <div id="view-conv" class="view-panel" style="display: none;">
      <div class="converter-card">
        <div class="converter-group">
          <label class="converter-label">Category</label>
          <select id="conv-cat" onchange="loadCategoryUnits()">
            <option value="length" selected>Length</option>
            <option value="weight">Weight / Mass</option>
            <option value="temp">Temperature</option>
            <option value="area">Area</option>
            <option value="volume">Volume</option>
            <option value="speed">Speed</option>
          </select>
        </div>

        <div class="converter-group">
          <label class="converter-label">From</label>
          <input type="number" id="conv-input" value="1" oninput="runConversion()" />
          <select id="conv-from" onchange="runConversion()">
            <option value="Meter (m)" selected>Meter (m)</option>
            <option value="Kilometer (km)">Kilometer (km)</option>
            <option value="Centimeter (cm)">Centimeter (cm)</option>
            <option value="Millimeter (mm)">Millimeter (mm)</option>
            <option value="Foot (ft)">Foot (ft)</option>
            <option value="Inch (in)">Inch (in)</option>
            <option value="Mile (mi)">Mile (mi)</option>
          </select>
        </div>

        <div class="swap-row">
          <button class="swap-circle-btn" onclick="swapUnits()">⇄</button>
        </div>

        <div class="converter-group">
          <label class="converter-label">To</label>
          <select id="conv-to" onchange="runConversion()">
            <option value="Meter (m)">Meter (m)</option>
            <option value="Kilometer (km)">Kilometer (km)</option>
            <option value="Centimeter (cm)">Centimeter (cm)</option>
            <option value="Millimeter (mm)">Millimeter (mm)</option>
            <option value="Foot (ft)" selected>Foot (ft)</option>
            <option value="Inch (in)">Inch (in)</option>
            <option value="Mile (mi)">Mile (mi)</option>
          </select>
        </div>

        <div class="result-display-box">
          <div class="converter-label">Converted Output</div>
          <div id="conv-result-val" class="result-number">3.28084</div>
          <div id="conv-result-lbl" class="result-unit-name">Foot (ft)</div>
        </div>
      </div>
    </div>

    <!-- Developer Footer -->
    <div class="developer-tag">
      Developed by <a href="https://github.com/Saqib7117" target="_blank" rel="noopener noreferrer">Saqib Mahmood</a>
    </div>
  </div>

  <script>
    function switchWindow(target) {
      document.getElementById('view-basic').style.display = 'none';
      document.getElementById('view-sci').style.display = 'none';
      document.getElementById('view-conv').style.display = 'none';

      document.getElementById('tab-basic').classList.remove('active');
      document.getElementById('tab-sci').classList.remove('active');
      document.getElementById('tab-conv').classList.remove('active');

      if (target === 'basic') {
        document.getElementById('view-basic').style.display = 'flex';
        document.getElementById('tab-basic').classList.add('active');
      } else if (target === 'sci') {
        document.getElementById('view-sci').style.display = 'flex';
        document.getElementById('tab-sci').classList.add('active');
      } else if (target === 'conv') {
        document.getElementById('view-conv').style.display = 'flex';
        document.getElementById('tab-conv').classList.add('active');
        runConversion();
      }
    }

    // Basic Calculator State
    let bCur = "0", bPrev = "", bOp = null, bReset = false;
    const bCurEl = document.getElementById("basic-cur");
    const bPrevEl = document.getElementById("basic-prev");

    function updateBasic() {
      bCurEl.innerText = bCur;
      bPrevEl.innerText = bOp ? `${bPrev} ${bOp}` : "";
    }

    function basicNum(n) {
      if (bCur === "0" || bReset) {
        bCur = n;
        bReset = false;
      } else {
        if (bCur.length < 14) bCur += n;
      }
      updateBasic();
    }

    function basicDecimal() {
      if (bReset) {
        bCur = "0.";
        bReset = false;
        updateBasic();
        return;
      }
      if (!bCur.includes(".")) {
        bCur += ".";
        updateBasic();
      }
    }

    function basicOp(op) {
      if (bOp && !bReset) basicCalculate();
      bOp = op;
      bPrev = bCur;
      bReset = true;
      updateBasic();
    }

    function basicCalculate() {
      if (!bOp || bReset) return;
      const p = parseFloat(bPrev), c = parseFloat(bCur);
      if (isNaN(p) || isNaN(c)) return;

      let res;
      if (bOp === "+") res = p + c;
      else if (bOp === "-") res = p - c;
      else if (bOp === "×") res = p * c;
      else if (bOp === "÷") {
        if (c === 0) {
          bCur = "Error";
          bPrev = "";
          bOp = null;
          bReset = true;
          updateBasic();
          return;
        }
        res = p / c;
      } else if (bOp === "%") {
        res = p % c;
      }

      bCur = Math.round(res * 1e11) / 1e11 + "";
      bPrev = "";
      bOp = null;
      bReset = true;
      updateBasic();
    }

    function basicClear() {
      bCur = "0";
      bPrev = "";
      bOp = null;
      bReset = false;
      updateBasic();
    }

    function basicDelete() {
      if (bReset) return;
      bCur = (bCur.length === 1 || bCur === "Error") ? "0" : bCur.slice(0, -1);
      updateBasic();
    }

    // Scientific Calculator State
    let sExpr = "";
    let sIsDeg = true;
    const sCurEl = document.getElementById("sci-cur");
    const sPrevEl = document.getElementById("sci-prev");
    const sBadgeEl = document.getElementById("sci-angle-badge");

    function toggleSciAngle() {
      sIsDeg = !sIsDeg;
      sBadgeEl.innerText = sIsDeg ? "DEG" : "RAD";
    }

    function sciInsert(token) {
      if (sExpr === "Error") sExpr = "";
      if (token === "±") {
        if (sExpr.startsWith("-")) sExpr = sExpr.slice(1);
        else sExpr = "-" + sExpr;
      } else {
        sExpr += token;
      }
      sCurEl.innerText = sExpr || "0";
    }

    function sciClear() {
      sExpr = "";
      sCurEl.innerText = "0";
      sPrevEl.innerText = "";
    }

    function sciDelete() {
      if (!sExpr || sExpr === "Error") {
        sExpr = "";
      } else {
        const fnTokens = ["sin(", "cos(", "tan(", "log(", "ln(", "√("];
        let matched = false;
        for (let fn of fnTokens) {
          if (sExpr.endsWith(fn)) {
            sExpr = sExpr.slice(0, -fn.length);
            matched = true;
            break;
          }
        }
        if (!matched) sExpr = sExpr.slice(0, -1);
      }
      sCurEl.innerText = sExpr || "0";
    }

    function factorial(n) {
      if (n < 0 || !Number.isInteger(n)) return NaN;
      if (n > 120) return Infinity;
      let r = 1;
      for (let i = 2; i <= n; i++) r *= i;
      return r;
    }

    function sciCalculate() {
      if (!sExpr || sExpr === "Error") return;
      sPrevEl.innerText = sExpr + " =";

      try {
        let parsed = sExpr;
        let openP = (parsed.match(/\(/g) \vert{}\vert{} []).length;         let closeP = (parsed.match(/\)/g) || []).length;
        if (openP > closeP) parsed += ")".repeat(openP - closeP);

        parsed = parsed.replace(/π/g, "(Math.PI)");
        parsed = parsed.replace(/e/g, "(Math.E)");
        parsed = parsed.replace(/×/g, "*");
        parsed = parsed.replace(/÷/g, "/");
        parsed = parsed.replace(/\^/g, "**");
        parsed = parsed.replace(/(\d+)!/g, "factorial($1)");

        if (sIsDeg) {
          parsed = parsed.replace(/sin\(/g, "Math.sin((Math.PI/180)*");
          parsed = parsed.replace(/cos\(/g, "Math.cos((Math.PI/180)*");
          parsed = parsed.replace(/tan\(/g, "Math.tan((Math.PI/180)*");
        } else {
          parsed = parsed.replace(/sin\(/g, "Math.sin(");
          parsed = parsed.replace(/cos\(/g, "Math.cos(");
          parsed = parsed.replace(/tan\(/g, "Math.tan(");
        }

        parsed = parsed.replace(/log\(/g, "Math.log10(");
        parsed = parsed.replace(/ln\(/g, "Math.log(");
        parsed = parsed.replace(/√\(/g, "Math.sqrt(");

        const evalResult = Function("factorial", `"use strict"; return (${parsed});`)(factorial);

        if (isNaN(evalResult) || !isFinite(evalResult)) {
          sCurEl.innerText = "Error";
          sExpr = "";
        } else {
          const finalVal = Math.round(evalResult * 1e10) / 1e10;
          sCurEl.innerText = finalVal.toString();
          sExpr = finalVal.toString();
        }
      } catch (err) {
        sCurEl.innerText = "Error";
        sExpr = "";
      }
    }

    // Unit Converter Definitions
    const unitDefinitions = {
      length: {
        "Meter (m)": 1,
        "Kilometer (km)": 1000,
        "Centimeter (cm)": 0.01,
        "Millimeter (mm)": 0.001,
        "Foot (ft)": 0.3048,
        "Inch (in)": 0.0254,
        "Yard (yd)": 0.9144,
        "Mile (mi)": 1609.344
      },
      weight: {
        "Kilogram (kg)": 1,
        "Gram (g)": 0.001,
        "Milligram (mg)": 0.000001,
        "Pound (lb)": 0.453592,
        "Ounce (oz)": 0.0283495,
        "Metric Ton (t)": 1000
      },
      temp: {
        "Celsius (°C)": "C",
        "Fahrenheit (°F)": "F",
        "Kelvin (K)": "K"
      },
      area: {
        "Square Meter (m²)": 1,
        "Square Kilometer (km²)": 1000000,
        "Square Foot (ft²)": 0.092903,
        "Square Mile (mi²)": 2589988.11,
        "Acre": 4046.86,
        "Hectare": 10000
      },
      volume: {
        "Liter (L)": 1,
        "Milliliter (mL)": 0.001,
        "Cubic Meter (m³)": 1000,
        "Gallon (US)": 3.78541,
        "Cup (US)": 0.24,
        "Fluid Ounce (fl oz)": 0.0295735
      },
      speed: {
        "Kilometers/hour (km/h)": 1,
        "Miles/hour (mph)": 1.60934,
        "Meters/sec (m/s)": 3.6,
        "Knot (kn)": 1.852
      }
    };

    function loadCategoryUnits() {
      const cat = document.getElementById("conv-cat").value;
      const fromEl = document.getElementById("conv-from");
      const toEl = document.getElementById("conv-to");
      fromEl.innerHTML = "";
      toEl.innerHTML = "";

      const keys = Object.keys(unitDefinitions[cat]);
      keys.forEach((unitName) => {
        fromEl.add(new Option(unitName, unitName));
        toEl.add(new Option(unitName, unitName));
      });

      if (keys.length > 1) toEl.selectedIndex = 1;
      runConversion();
    }

    function swapUnits() {
      const fromEl = document.getElementById("conv-from");
      const toEl = document.getElementById("conv-to");
      const tmp = fromEl.selectedIndex;
      fromEl.selectedIndex = toEl.selectedIndex;
      toEl.selectedIndex = tmp;
      runConversion();
    }

    function runConversion() {
      const cat = document.getElementById("conv-cat").value;
      const val = parseFloat(document.getElementById("conv-input").value);
      const from = document.getElementById("conv-from").value;
      const to = document.getElementById("conv-to").value;
      const resValEl = document.getElementById("conv-result-val");
      const resLblEl = document.getElementById("conv-result-lbl");

      if (isNaN(val)) {
        resValEl.innerText = "0";
        resLblEl.innerText = to;
        return;
      }

      let res;
      if (cat === "temp") {
        let c;
        if (from.includes("Celsius")) c = val;
        else if (from.includes("Fahrenheit")) c = (val - 32) * (5 / 9);
        else c = val - 273.15;

        if (to.includes("Celsius")) res = c;
        else if (to.includes("Fahrenheit")) res = (c * 9 / 5) + 32;
        else res = c + 273.15;
      } else {
        const rates = unitDefinitions[cat];
        const base = val * rates[from];
        res = base / rates[to];
      }

      resValEl.innerText = (Math.round(res * 1e8) / 1e8).toLocaleString();
      resLblEl.innerText = to;
    }

    runConversion();
  </script>
</body>
</html>
