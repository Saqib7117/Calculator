<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Scientific & Matrix Calculator</title>

  <!-- PWA & Mobile App Support -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #0b1120;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      background-color: #1e293b;
      display: flex;
      flex-direction: column;
      padding: 0.65rem 0.65rem calc(0.5rem + env(safe-area-inset-bottom, 0px)) 0.65rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
    }

    @media (min-width: 600px) {
      .app-container {
        height: 94vh;
        max-height: 900px;
        border-radius: 2rem;
        padding: 1.25rem;
      }
    }

    /* Top Navigation Tabs */
    .nav-tabs {
      display: flex;
      background-color: #0f172a;
      border-radius: 0.85rem;
      padding: 0.25rem;
      margin-bottom: 0.65rem;
      gap: 0.25rem;
    }

    .nav-tab {
      flex: 1;
      padding: 0.55rem 0.15rem;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 0.6rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .nav-tab.active {
      background-color: #334155;
      color: #f8fafc;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* View Panels */
    .view-panel {
      flex: 1;
      flex-direction: column;
      overflow-y: auto;
    }

    /* Calculator Displays */
    .display-screen {
      flex: 0 0 20%;
      min-height: 100px;
      background-color: #0f172a;
      border-radius: 1rem;
      padding: 0.85rem 1.15rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      margin-bottom: 0.65rem;
      overflow: hidden;
      word-break: break-all;
      position: relative;
    }

    .mode-indicator {
      position: absolute;
      top: 0.6rem;
      left: 0.75rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: #38bdf8;
      background: #1e293b;
      padding: 0.2rem 0.5rem;
      border-radius: 0.4rem;
      cursor: pointer;
    }

    .sub-display {
      color: #94a3b8;
      font-size: 0.95rem;
      min-height: 1.3rem;
      margin-bottom: 0.2rem;
    }

    .main-display {
      color: #f8fafc;
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1.1;
      text-align: right;
    }

    /* Keypads */
    .keypad-basic {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 0.6rem;
    }

    .keypad-scientific {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 0.35rem;
    }

    button {
      width: 100%;
      height: 100%;
      border-radius: 0.75rem;
      border: none;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      color: #f8fafc;
      background-color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: filter 0.15s ease, transform 0.06s ease;
      touch-action: manipulation;
    }

    button:active {
      filter: brightness(1.25);
      transform: scale(0.96);
    }

    button.btn-fn {
      background-color: #475569;
      color: #f8fafc;
      font-size: 1.1rem;
    }

    button.btn-sci {
      background-color: #1e293b;
      color: #38bdf8;
      font-size: 0.92rem;
      border: 1px solid #334155;
    }

    button.btn-op {
      background-color: #f97316;
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 700;
    }

    button.btn-op:active {
      background-color: #ea580c;
    }

    button.btn-equal {
      grid-column: span 2;
      background-color: #ea580c;
      color: #ffffff;
      font-size: 2.1rem;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.4);
    }

    /* Matrix Interface */
    .matrix-card {
      flex: 1;
      background-color: #0f172a;
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      overflow-y: auto;
    }

    .matrix-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .matrix-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dim-btn {
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      border-radius: 0.5rem;
      background-color: #334155;
      color: #f8fafc;
      width: auto;
      height: auto;
    }

    .matrix-grid {
      display: grid;
      gap: 0.4rem;
      margin: 0.35rem 0;
    }

    .matrix-grid.dim-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .matrix-grid.dim-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .matrix-cell {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 0.5rem;
      padding: 0.6rem;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      outline: none;
      user-select: text;
    }

    .matrix-ops {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      margin-top: 0.25rem;
    }

    .matrix-op-btn {
      padding: 0.6rem 0.2rem;
      font-size: 0.85rem;
      border-radius: 0.6rem;
      background-color: #334155;
      color: #f8fafc;
      width: 100%;
      height: auto;
    }

    .matrix-op-btn.highlight {
      background-color: #f97316;
      color: #fff;
    }

    .matrix-result-box {
      background: #1e293b;
      border-radius: 0.75rem;
      padding: 0.85rem;
      border-left: 4px solid #f97316;
      margin-top: 0.25rem;
    }

    .matrix-result-grid {
      display: grid;
      gap: 0.35rem;
      margin-top: 0.5rem;
    }

    .res-cell {
      background: #0f172a;
      border-radius: 0.4rem;
      padding: 0.45rem;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      color: #38bdf8;
    }

    /* Unit Converter */
    .converter-card {
      flex: 1;
      background-color: #0f172a;
      border-radius: 1rem;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      overflow-y: auto;
    }

    .converter-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .converter-label {
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input[type="number"] {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 0.75rem;
      padding: 0.8rem 1rem;
      font-size: 1.1rem;
      font-weight: 500;
      outline: none;
      user-select: text;
    }

    select:focus, input[type="number"]:focus {
      border-color: #38bdf8;
    }

    .swap-row {
      display: flex;
      justify-content: center;
      margin: -0.25rem 0;
    }

    .swap-circle-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #334155;
      color: #38bdf8;
      font-size: 1.3rem;
    }

    .result-display-box {
      background: #1e293b;
      border-radius: 0.85rem;
      padding: 1rem;
      border-left: 4px solid #f97316;
    }

    .result-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: #f8fafc;
      word-break: break-all;
    }

    .result-unit-name {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 0.3rem;
    }

    /* Footer */
    .developer-tag {
      text-align: center;
      color: #64748b;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.4px;
      padding-top: 0.45rem;
      user-select: text;
    }

    .developer-tag a {
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
    }

    .developer-tag a:hover {
      color: #f97316;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Tabs (4 Windows) -->
    <div class="nav-tabs">
      <button id="btn-basic" class="nav-tab active" onclick="openTab('basic')">Basic</button>
      <button id="btn-sci" class="nav-tab" onclick="openTab('sci')">Scientific</button>
      <button id="btn-matrix" class="nav-tab" onclick="openTab('matrix')">Matrices</button>
      <button id="btn-conv" class="nav-tab" onclick="openTab('conv')">Converter</button>
    </div>

    <!-- WINDOW 1: BASIC CALCULATOR -->
    <div id="view-basic" class="view-panel" style="display: flex;">
      <div class="display-screen">
        <div id="b-sub" class="sub-display"></div>
        <div id="b-main" class="main-display">0</div>
      </div>
      <div class="keypad-basic">
        <button class="btn-fn" onclick="bClear()">AC</button>
        <button class="btn-fn" onclick="bDelete()">DEL</button>
        <button class="btn-fn" onclick="bOperator('%')">%</button>
        <button class="btn-op" onclick="bOperator('÷')">÷</button>

        <button onclick="bDigit('7')">7</button>
        <button onclick="bDigit('8')">8</button>
        <button onclick="bDigit('9')">9</button>
        <button class="btn-op" onclick="bOperator('×')">×</button>

        <button onclick="bDigit('4')">4</button>
        <button onclick="bDigit('5')">5</button>
        <button onclick="bDigit('6')">6</button>
        <button class="btn-op" onclick="bOperator('-')">-</button>

        <button onclick="bDigit('1')">1</button>
        <button onclick="bDigit('2')">2</button>
        <button onclick="bDigit('3')">3</button>
        <button class="btn-op" onclick="bOperator('+')">+</button>

        <button onclick="bDigit('0')">0</button>
        <button onclick="bDecimal()">.</button>
        <button class="btn-equal" onclick="bEquals()">=</button>
      </div>
    </div>

    <!-- WINDOW 2: COMPREHENSIVE SCIENTIFIC CALCULATOR -->
    <div id="view-sci" class="view-panel" style="display: none;">
      <div class="display-screen">
        <span id="sci-badge" class="mode-indicator" onclick="toggleSciMode()">DEG</span>
        <div id="s-sub" class="sub-display"></div>
        <div id="s-main" class="main-display">0</div>
      </div>
      <div class="keypad-scientific">
        <!-- Row 1: Trig & DEG/RAD -->
        <button class="btn-sci" onclick="toggleSciMode()">DEG/RAD</button>
        <button class="btn-sci" onclick="sInput('sin(')">sin</button>
        <button class="btn-sci" onclick="sInput('cos(')">cos</button>
        <button class="btn-sci" onclick="sInput('tan(')">tan</button>
        <button class="btn-fn" onclick="sClear()">AC</button>

        <!-- Row 2: Inverses -->
        <button class="btn-sci" onclick="sInput('asin(')">sin⁻¹</button>
        <button class="btn-sci" onclick="sInput('acos(')">cos⁻¹</button>
        <button class="btn-sci" onclick="sInput('atan(')">tan⁻¹</button>
        <button class="btn-sci" onclick="sInput('π')">π</button>
        <button class="btn-fn" onclick="sDelete()">DEL</button>

        <!-- Row 3: Hyperbolics & e -->
        <button class="btn-sci" onclick="sInput('sinh(')">sinh</button>
        <button class="btn-sci" onclick="sInput('cosh(')">cosh</button>
        <button class="btn-sci" onclick="sInput('tanh(')">tanh</button>
        <button class="btn-sci" onclick="sInput('e')">e</button>
        <button class="btn-op" onclick="sInput('÷')">÷</button>

        <!-- Row 4: Logarithms & Roots -->
        <button class="btn-sci" onclick="sInput('log(')">log</button>
        <button class="btn-sci" onclick="sInput('ln(')">ln</button>
        <button class="btn-sci" onclick="sInput('√(')">√</button>
        <button class="btn-sci" onclick="sInput('cbrt(')">∛</button>
        <button class="btn-op" onclick="sInput('×')">×</button>

        <!-- Row 5: Powers & Factorial -->
        <button class="btn-sci" onclick="sInput('^2')">x²</button>
        <button class="btn-sci" onclick="sInput('^3')">x³</button>
        <button class="btn-sci" onclick="sInput('^')">xʸ</button>
        <button class="btn-sci" onclick="sInput('!')">n!</button>
        <button class="btn-op" onclick="sInput('-')">-</button>

        <!-- Row 6: Numbers & Parentheses -->
        <button class="btn-sci" onclick="sInput('(')">(</button>
        <button onclick="sInput('7')">7</button>
        <button onclick="sInput('8')">8</button>
        <button onclick="sInput('9')">9</button>
        <button class="btn-op" onclick="sInput('+')">+</button>

        <!-- Row 7: Numbers & Absolute Value -->
        <button class="btn-sci" onclick="sInput(')')">)</button>
        <button onclick="sInput('4')">4</button>
        <button onclick="sInput('5')">5</button>
        <button onclick="sInput('6')">6</button>
        <button class="btn-sci" onclick="sInput('abs(')">|x|</button>

        <!-- Row 8: 1-3, 0, Decimal, Equal -->
        <button onclick="sInput('1')">1</button>
        <button onclick="sInput('2')">2</button>
        <button onclick="sInput('3')">3</button>
        <button onclick="sInput('0')">0</button>
        <button onclick="sInput('.')">.</button>
        <button class="btn-equal" onclick="sEquals()" style="grid-column: span 5; margin-top: 0.2rem;">=</button>
      </div>
    </div>

    <!-- WINDOW 3: MATRICES CALCULATOR -->
    <div id="view-matrix" class="view-panel" style="display: none;">
      <div class="matrix-card">
        <!-- Dimension Switcher -->
        <div class="matrix-header">
          <span class="matrix-title">Matrix Dimension</span>
          <div>
            <button class="dim-btn" id="dim-2-btn" onclick="setMatrixDim(2)" style="background:#f97316;">2 × 2</button>
            <button class="dim-btn" id="dim-3-btn" onclick="setMatrixDim(3)">3 × 3</button>
          </div>
        </div>

        <!-- Matrix A -->
        <span class="converter-label">Matrix A</span>
        <div id="mat-a-grid" class="matrix-grid dim-2"></div>

        <!-- Matrix B -->
        <span class="converter-label">Matrix B</span>
        <div id="mat-b-grid" class="matrix-grid dim-2"></div>

        <!-- Operations -->
        <span class="converter-label">Operations</span>
        <div class="matrix-ops">
          <button class="matrix-op-btn highlight" onclick="matrixBinaryOp('add')">A + B</button>
          <button class="matrix-op-btn highlight" onclick="matrixBinaryOp('sub')">A - B</button>
          <button class="matrix-op-btn highlight" onclick="matrixBinaryOp('mul')">A × B</button>
          <button class="matrix-op-btn" onclick="matrixUnaryOp('detA')">det(A)</button>
          <button class="matrix-op-btn" onclick="matrixUnaryOp('invA')">A⁻¹</button>
          <button class="matrix-op-btn" onclick="matrixUnaryOp('transA')">Aᵀ</button>
          <button class="matrix-op-btn" onclick="matrixUnaryOp('detB')">det(B)</button>
          <button class="matrix-op-btn" onclick="matrixUnaryOp('invB')">B⁻¹</button>
          <button class="matrix-op-btn" onclick="matrixUnaryOp('transB')">Bᵀ</button>
        </div>

        <!-- Matrix Result -->
        <div class="matrix-result-box">
          <div id="matrix-res-title" class="converter-label">Matrix Output</div>
          <div id="matrix-res-val" style="color:#f8fafc; font-weight:700; font-size:1.1rem; margin-top:0.35rem;">Enter values and choose operation</div>
          <div id="matrix-res-grid" class="matrix-result-grid dim-2"></div>
        </div>
      </div>
    </div>

    <!-- WINDOW 4: UNIT CONVERTER -->
    <div id="view-conv" class="view-panel" style="display: none;">
      <div class="converter-card">
        <div class="converter-group">
          <label class="converter-label">Select Category</label>
          <select id="u-category" onchange="changeUnitCategory()">
            <option value="length" selected>Length</option>
            <option value="weight">Weight / Mass</option>
            <option value="temp">Temperature</option>
            <option value="area">Area</option>
            <option value="volume">Volume</option>
            <option value="speed">Speed</option>
            <option value="pressure">Pressure</option>
            <option value="data">Digital Data</option>
          </select>
        </div>

        <div class="converter-group">
          <label class="converter-label">From</label>
          <input type="number" id="u-val" value="1" oninput="doConvert()" />
          <select id="u-from" onchange="doConvert()">
            <option value="Meter (m)" selected>Meter (m)</option>
            <option value="Kilometer (km)">Kilometer (km)</option>
            <option value="Centimeter (cm)">Centimeter (cm)</option>
            <option value="Millimeter (mm)">Millimeter (mm)</option>
            <option value="Foot (ft)">Foot (ft)</option>
            <option value="Inch (in)">Inch (in)</option>
            <option value="Mile (mi)">Mile (mi)</option>
          </select>
        </div>

        <div class="swap-row">
          <button class="swap-circle-btn" onclick="swapUnitFields()">⇄</button>
        </div>

        <div class="converter-group">
          <label class="converter-label">To</label>
          <select id="u-to" onchange="doConvert()">
            <option value="Meter (m)">Meter (m)</option>
            <option value="Kilometer (km)">Kilometer (km)</option>
            <option value="Centimeter (cm)">Centimeter (cm)</option>
            <option value="Millimeter (mm)">Millimeter (mm)</option>
            <option value="Foot (ft)" selected>Foot (ft)</option>
            <option value="Inch (in)">Inch (in)</option>
            <option value="Mile (mi)">Mile (mi)</option>
          </select>
        </div>

        <div class="result-display-box">
          <div class="converter-label">Converted Output</div>
          <div id="u-result-num" class="result-number">3.28084</div>
          <div id="u-result-unit" class="result-unit-name">Foot (ft)</div>
        </div>
      </div>
    </div>

    <!-- Developer Footer -->
    <div class="developer-tag">
      Developed by <a href="https://github.com/Saqib7117" target="_blank" rel="noopener noreferrer">Saqib Mahmood</a>
    </div>
  </div>

  <script>
    // Tab Navigation
    window.openTab = function(tab) {
      const views = ['basic', 'sci', 'matrix', 'conv'];
      views.forEach(v => {
        const panel = document.getElementById('view-' + v);
        const btn = document.getElementById('btn-' + v);
        if (panel) panel.style.display = (v === tab) ? 'flex' : 'none';
        if (btn) btn.classList.toggle('active', v === tab);
      });
      if (tab === 'conv') window.doConvert();
    };

    // ==========================================
    // 1. BASIC CALCULATOR
    // ==========================================
    let bValue = "0", bOldValue = "", bCurrentOp = null, bMustReset = false;

    function bRender() {
      const main = document.getElementById('b-main');
      const sub = document.getElementById('b-sub');
      if (main) main.innerText = bValue;
      if (sub) sub.innerText = bCurrentOp ? (bOldValue + " " + bCurrentOp) : "";
    }

    window.bDigit = function(d) {
      if (bValue === "0" || bMustReset) {
        bValue = d;
        bMustReset = false;
      } else {
        if (bValue.length < 14) bValue += d;
      }
      bRender();
    };

    window.bDecimal = function() {
      if (bMustReset) {
        bValue = "0.";
        bMustReset = false;
        bRender();
        return;
      }
      if (!bValue.includes(".")) {
        bValue += ".";
        bRender();
      }
    };

    window.bOperator = function(op) {
      if (bCurrentOp && !bMustReset) window.bEquals();
      bCurrentOp = op;
      bOldValue = bValue;
      bMustReset = true;
      bRender();
    };

    window.bEquals = function() {
      if (!bCurrentOp || bMustReset) return;
      const p = parseFloat(bOldValue), c = parseFloat(bValue);
      if (isNaN(p) || isNaN(c)) return;

      let res = 0;
      if (bCurrentOp === "+") res = p + c;
      else if (bCurrentOp === "-") res = p - c;
      else if (bCurrentOp === "×") res = p * c;
      else if (bCurrentOp === "÷") {
        if (c === 0) { bValue = "Error"; bOldValue = ""; bCurrentOp = null; bMustReset = true; bRender(); return; }
        res = p / c;
      } else if (bCurrentOp === "%") {
        res = p % c;
      }

      bValue = Math.round(res * 1e11) / 1e11 + "";
      bOldValue = "";
      bCurrentOp = null;
      bMustReset = true;
      bRender();
    };

    window.bClear = function() {
      bValue = "0";
      bOldValue = "";
      bCurrentOp = null;
      bMustReset = false;
      bRender();
    };

    window.bDelete = function() {
      if (bMustReset) return;
      bValue = (bValue.length === 1 || bValue === "Error") ? "0" : bValue.slice(0, -1);
      bRender();
    };

    // ==========================================
    // 2. SCIENTIFIC CALCULATOR
    // ==========================================
    let sFormula = "";
    let sDegrees = true;

    window.toggleSciMode = function() {
      sDegrees = !sDegrees;
      const badge = document.getElementById('sci-badge');
      if (badge) badge.innerText = sDegrees ? "DEG" : "RAD";
    };

    window.sInput = function(token) {
      if (sFormula === "Error") sFormula = "";
      sFormula += token;
      const main = document.getElementById('s-main');
      if (main) main.innerText = sFormula || "0";
    };

    window.sClear = function() {
      sFormula = "";
      const main = document.getElementById('s-main');
      const sub = document.getElementById('s-sub');
      if (main) main.innerText = "0";
      if (sub) sub.innerText = "";
    };

    window.sDelete = function() {
      if (!sFormula || sFormula === "Error") {
        sFormula = "";
      } else {
        const fullTokens = ["asin(", "acos(", "atan(", "sinh(", "cosh(", "tanh(", "sin(", "cos(", "tan(", "log(", "ln(", "√(", "cbrt(", "abs("];
        let stripped = false;
        for (let i = 0; i < fullTokens.length; i++) {
          let fn = fullTokens[i];
          if (sFormula.endsWith(fn)) {
            sFormula = sFormula.slice(0, -fn.length);
            stripped = true;
            break;
          }
        }
        if (!stripped) sFormula = sFormula.slice(0, -1);
      }
      const main = document.getElementById('s-main');
      if (main) main.innerText = sFormula || "0";
    };

    function factCalc(n) {
      if (n < 0 || !Number.isInteger(n)) return NaN;
      if (n > 120) return Infinity;
      let r = 1;
      for (let i = 2; i <= n; i++) r *= i;
      return r;
    }

    window.sEquals = function() {
      if (!sFormula || sFormula === "Error") return;
      const sub = document.getElementById('s-sub');
      const main = document.getElementById('s-main');
      if (sub) sub.innerText = sFormula + " =";

      try {
        let expr = sFormula;
        let openCount = (expr.match(/\(/g) || []).length;
        let closeCount = (expr.match(/\)/g) || []).length;
        if (openCount > closeCount) expr += ")".repeat(openCount - closeCount);

        expr = expr.replace(/π/g, "(Math.PI)");
        expr = expr.replace(/e/g, "(Math.E)");
        expr = expr.replace(/×/g, "*");
        expr = expr.replace(/÷/g, "/");
        expr = expr.replace(/\^/g, "**");
        expr = expr.replace(/(\d+)!/g, "factCalc($1)");

        // Inverse Trigonometry
        if (sDegrees) {
          expr = expr.replace(/asin\(/g, "(180/Math.PI)*Math.asin(");
          expr = expr.replace(/acos\(/g, "(180/Math.PI)*Math.acos(");
          expr = expr.replace(/atan\(/g, "(180/Math.PI)*Math.atan(");
          expr = expr.replace(/sin\(/g, "Math.sin((Math.PI/180)*");
          expr = expr.replace(/cos\(/g, "Math.cos((Math.PI/180)*");
          expr = expr.replace(/tan\(/g, "Math.tan((Math.PI/180)*");
        } else {
          expr = expr.replace(/asin\(/g, "Math.asin(");
          expr = expr.replace(/acos\(/g, "Math.acos(");
          expr = expr.replace(/atan\(/g, "Math.atan(");
          expr = expr.replace(/sin\(/g, "Math.sin(");
          expr = expr.replace(/cos\(/g, "Math.cos(");
          expr = expr.replace(/tan\(/g, "Math.tan(");
        }

        // Hyperbolic
        expr = expr.replace(/sinh\(/g, "Math.sinh(");
        expr = expr.replace(/cosh\(/g, "Math.cosh(");
        expr = expr.replace(/tanh\(/g, "Math.tanh(");

        // Logs & Roots
        expr = expr.replace(/log\(/g, "Math.log10(");
        expr = expr.replace(/ln\(/g, "Math.log(");
        expr = expr.replace(/√\(/g, "Math.sqrt(");
        expr = expr.replace(/cbrt\(/g, "Math.cbrt(");
        expr = expr.replace(/abs\(/g, "Math.abs(");

        const out = Function("factCalc", `"use strict"; return (${expr});`)(factCalc);

        if (isNaN(out) || !isFinite(out)) {
          if (main) main.innerText = "Error";
          sFormula = "";
        } else {
          const finalVal = Math.round(out * 1e10) / 1e10;
          if (main) main.innerText = finalVal.toString();
          sFormula = finalVal.toString();
        }
      } catch (e) {
        if (main) main.innerText = "Error";
        sFormula = "";
      }
    };

    // ==========================================
    // 3. MATRIX CALCULATOR
    // ==========================================
    let matrixDim = 2;

    function buildMatrixInputs() {
      const aGrid = document.getElementById('mat-a-grid');
      const bGrid = document.getElementById('mat-b-grid');
      aGrid.className = `matrix-grid dim-${matrixDim}`;
      bGrid.className = `matrix-grid dim-${matrixDim}`;
      aGrid.innerHTML = "";
      bGrid.innerHTML = "";

      for (let r = 0; r < matrixDim; r++) {
        for (let c = 0; c < matrixDim; c++) {
          aGrid.innerHTML += `<input type="number" id="a_${r}_${c}" class="matrix-cell" value="${r === c ? 1 : 0}">`;
          bGrid.innerHTML += `<input type="number" id="b_${r}_${c}" class="matrix-cell" value="${r === c ? 2 : 0}">`;
        }
      }
    }

    window.setMatrixDim = function(dim) {
      matrixDim = dim;
      document.getElementById('dim-2-btn').style.background = dim === 2 ? '#f97316' : '#334155';
      document.getElementById('dim-3-btn').style.background = dim === 3 ? '#f97316' : '#334155';
      buildMatrixInputs();
    };

    function readMatrix(prefix) {
      const m = [];
      for (let r = 0; r < matrixDim; r++) {
        m[r] = [];
        for (let c = 0; c < matrixDim; c++) {
          const val = parseFloat(document.getElementById(`${prefix}_${r}_${c}`).value);
          m[r][c] = isNaN(val) ? 0 : val;
        }
      }
      return m;
    }

    function displayMatrixResult(title, content, isScalar) {
      document.getElementById('matrix-res-title').innerText = title;
      const resValEl = document.getElementById('matrix-res-val');
      const resGridEl = document.getElementById('matrix-res-grid');
      resGridEl.innerHTML = "";

      if (isScalar) {
        resValEl.style.display = "block";
        resValEl.innerText = content;
        resGridEl.style.display = "none";
      } else {
        resValEl.style.display = "none";
        resGridEl.style.display = "grid";
        resGridEl.className = `matrix-result-grid dim-${content.length}`;
        for (let r = 0; r < content.length; r++) {
          for (let c = 0; c < content[r].length; c++) {
            resGridEl.innerHTML += `<div class="res-cell">${content[r][c]}</div>`;
          }
        }
      }
    }

    function det2(m) { return m[0][0]*m - m[0]*m[0]; }
    function det3(m) {
      return m[0][0]*(m*m - m*m)
           - m[0]*(m[0]*m - m*m[0])
           + m[0]*(m[0]*m - m*m[0]);
    }

    function inv2(m) {
      const d = det2(m);
      if (Math.abs(d) < 1e-10) return null;
      return [
        [Math.round((m[1]/d)*1e4)/1e4, Math.round((-m[0]/d)*1e4)/1e4],
        [Math.round((-m[1][0]/d)*1e4)/1e4, Math.round((m[0][0]/d)*1e4)/1e4]
      ];
    }

    function inv3(m) {
      const d = det3(m);
      if (Math.abs(d) < 1e-10) return null;
      const adj = [
        [ (m[1]*m - m*m), -(m[0]*m - m[0]*m),  (m[0]*m - m[0]*m) ],
        [-(m[1][0]*m - m*m[0]),  (m[0][0]*m - m[0]*m[0]), -(m[0][0]*m - m[0]*m[0]) ],
        [ (m[1][0]*m - m*m[0]), -(m[0][0]*m - m[0]*m[0]),  (m[0][0]*m - m[0]*m[0]) ]
      ];
      return adj.map(row => row.map(v => Math.round((v / d) * 1e4) / 1e4));
    }

    window.matrixUnaryOp = function(op) {
      const target = op.endsWith('B') ? 'b' : 'a';
      const name = target.toUpperCase();
      const m = readMatrix(target);

      if (op.startsWith('det')) {
        const d = (matrixDim === 2) ? det2(m) : det3(m);
        displayMatrixResult(`det(${name})`, `Determinant: ${Math.round(d * 1e6) / 1e6}`, true);
      } else if (op.startsWith('trans')) {
        const t = [];
        for (let r = 0; r < matrixDim; r++) {
          t[r] = [];
          for (let c = 0; c < matrixDim; c++) t[r][c] = m[c][r];
        }
        displayMatrixResult(`${name}ᵀ (Transpose)`, t, false);
      } else if (op.startsWith('inv')) {
        const inv = (matrixDim === 2) ? inv2(m) : inv3(m);
        if (!inv) displayMatrixResult(`${name}⁻¹`, "Matrix is Singular (No Inverse)", true);
        else displayMatrixResult(`${name}⁻¹ (Inverse)`, inv, false);
      }
    };

    window.matrixBinaryOp = function(op) {
      const a = readMatrix('a');
      const b = readMatrix('b');
      const res = [];

      if (op === 'add') {
        for (let r = 0; r < matrixDim; r++) {
          res[r] = [];
          for (let c = 0; c < matrixDim; c++) res[r][c] = a[r][c] + b[r][c];
        }
        displayMatrixResult("A + B", res, false);
      } else if (op === 'sub') {
        for (let r = 0; r < matrixDim; r++) {
          res[r] = [];
          for (let c = 0; c < matrixDim; c++) res[r][c] = a[r][c] - b[r][c];
        }
        displayMatrixResult("A - B", res, false);
      } else if (op === 'mul') {
        for (let r = 0; r < matrixDim; r++) {
          res[r] = [];
          for (let c = 0; c < matrixDim; c++) {
            let sum = 0;
            for (let k = 0; k < matrixDim; k++) sum += a[r][k] * b[k][c];
            res[r][c] = Math.round(sum * 1e5) / 1e5;
          }
        }
        displayMatrixResult("A × B", res, false);
      }
    };

    // ==========================================
    // 4. UNIT CONVERTER
    // ==========================================
    const unitsData = {
      length: { "Meter (m)": 1, "Kilometer (km)": 1000, "Centimeter (cm)": 0.01, "Millimeter (mm)": 0.001, "Foot (ft)": 0.3048, "Inch (in)": 0.0254, "Yard (yd)": 0.9144, "Mile (mi)": 1609.344 },
      weight: { "Kilogram (kg)": 1, "Gram (g)": 0.001, "Milligram (mg)": 0.000001, "Pound (lb)": 0.453592, "Ounce (oz)": 0.0283495, "Metric Ton (t)": 1000 },
      temp: { "Celsius (°C)": "C", "Fahrenheit (°F)": "F", "Kelvin (K)": "K" },
      area: { "Square Meter (m²)": 1, "Square Kilometer (km²)": 1e6, "Square Foot (ft²)": 0.092903, "Square Mile (mi²)": 2589988.11, "Acre": 4046.86, "Hectare": 10000 },
      volume: { "Liter (L)": 1, "Milliliter (mL)": 0.001, "Cubic Meter (m³)": 1000, "Gallon (US)": 3.78541, "Cup (US)": 0.24, "Fluid Ounce (fl oz)": 0.0295735 },
      speed: { "Kilometers/hour (km/h)": 1, "Miles/hour (mph)": 1.60934, "Meters/sec (m/s)": 3.6, "Knot (kn)": 1.852 },
      pressure: { "Pascal (Pa)": 1, "Bar": 100000, "Atmosphere (atm)": 101325, "PSI": 6894.76, "Torr (mmHg)": 133.322 },
      data: { "Byte (B)": 1, "Kilobyte (KB)": 1024, "Megabyte (MB)": 1048576, "Gigabyte (GB)": 1073741824, "Terabyte (TB)": 1099511627776 }
    };

    window.changeUnitCategory = function() {
      const cat = document.getElementById("u-category").value;
      const fromEl = document.getElementById("u-from");
      const toEl = document.getElementById("u-to");
      fromEl.innerHTML = "";
      toEl.innerHTML = "";

      const keys = Object.keys(unitsData[cat]);
      keys.forEach((unitName) => {
        fromEl.add(new Option(unitName, unitName));
        toEl.add(new Option(unitName, unitName));
      });

      if (keys.length > 1) toEl.selectedIndex = 1;
      window.doConvert();
    };

    window.swapUnitFields = function() {
      const fromEl = document.getElementById("u-from");
      const toEl = document.getElementById("u-to");
      const temp = fromEl.selectedIndex;
      fromEl.selectedIndex = toEl.selectedIndex;
      toEl.selectedIndex = temp;
      window.doConvert();
    };

    window.doConvert = function() {
      const cat = document.getElementById("u-category").value;
      const val = parseFloat(document.getElementById("u-val").value);
      const from = document.getElementById("u-from").value;
      const to = document.getElementById("u-to").value;
      const resNumEl = document.getElementById("u-result-num");
      const resUnitEl = document.getElementById("u-result-unit");

      if (isNaN(val)) {
        resNumEl.innerText = "0";
        resUnitEl.innerText = to;
        return;
      }

      let res = 0;
      if (cat === "temp") {
        let c = 0;
        if (from.includes("Celsius")) c = val;
        else if (from.includes("Fahrenheit")) c = (val - 32) * (5 / 9);
        else c = val - 273.15;

        if (to.includes("Celsius")) res = c;
        else if (to.includes("Fahrenheit")) res = (c * 9 / 5) + 32;
        else res = c + 273.15;
      } else {
        const rates = unitsData[cat];
        if (rates && rates[from] && rates[to]) {
          const base = val * rates[from];
          res = base / rates[to];
        }
      }

      resNumEl.innerText = (Math.round(res * 1e8) / 1e8).toLocaleString();
      resUnitEl.innerText = to;
    };

    // Initial setup on load
    bRender();
    buildMatrixInputs();
    window.doConvert();
  </script>
</body>
